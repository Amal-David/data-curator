[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "data-curator-studio"
version = "0.1.0"
description = "An inspectable local-first data curation studio with reproducible runs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Data Curator contributors" }]
dependencies = []

[project.scripts]
data-curator = "data_curator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/data_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/data_curator"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
